name: Issue 8 source contracts

on:
  push:
    branches:
      - fix/issue-8-merged-hq-quantities
  pull_request:

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight C# syntax parser
        run: python -m pip install tree-sitter tree-sitter-c-sharp
      - name: Parse changed C# files
        run: python tools/tests/check_issue8_syntax.py
      - name: Verify issue 8 static contracts and scenario
        run: python -m unittest discover -s tools/tests -p 'test_issue8_*.py' -v

# Unity/game integration is exercised with tools/scenarios/t-issue8-quantities.json
# on a Windows installation of Big Ambitions. It cannot run on hosted CI.
